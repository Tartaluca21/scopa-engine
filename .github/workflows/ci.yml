name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # --locked fails if uv.lock is out of sync with pyproject.toml, so a
      # dependency edit that skips `uv lock` cannot slip through CI.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run mypy .

  pip-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      # Every console script that exposes a no-op --help is smoke-checked here.
      # scopa-stats / scopa-match-stats are intentionally excluded: they do real
      # work (read log files) and have no --help, so they are not smoke-safe.
      - name: console scripts are installed and smoke-safe
        run: |
          scopa-play --help
          scopa-gui --help
          scopa-train --help
          scopa-benchmark --help
          scopa-ab-eval --help
